<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Venchure — AI-Powered Marketing &amp; Brand Growth</title>
  <link rel="icon" type="image/png" href="/assets/tv-favicon.png">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .nav {
      position: fixed;
      top: 14px; left: 14px; right: 14px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 20px 0 16px;
      background: rgba(8,8,8,0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      transition: background 0.3s, border-color 0.3s;
    }
    .nav.scrolled { background: rgba(8,8,8,0.96); border-color: rgba(255,255,255,0.07); }

    .nav-logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
    .nav-logo img { height: 36px; width: auto; }

    .nav-links {
      display: flex; align-items: center; gap: 36px; list-style: none;
      position: absolute; left: 50%; transform: translateX(-50%);
    }
    .nav-links a {
      text-decoration: none;
      color: rgba(255,255,255,0.75);
      font-size: 11.5px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      white-space: nowrap; transition: color 0.2s;
    }
    .nav-links a:hover { color: #fff; }

    .nav-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .btn-lang {
      display: flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.8);
      font-size: 11.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.22); border-radius: 8px;
      padding: 7px 12px; background: transparent; cursor: pointer; font-family: inherit;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-lang:hover { border-color: rgba(255,255,255,0.45); color: #fff; }
    .btn-lang svg { width: 13px; height: 13px; flex-shrink: 0; }

    .btn-estimate {
      display: flex; align-items: center; gap: 8px;
      color: #fff; font-size: 11.5px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.30); border-radius: 8px;
      padding: 7px 16px; background: transparent; cursor: pointer;
      text-decoration: none; white-space: nowrap; font-family: inherit;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-estimate:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.55); }

    .nav-hamburger {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; background: none; border: none; padding: 4px;
    }
    .nav-hamburger span {
      display: block; width: 22px; height: 1.5px;
      background: #fff; border-radius: 2px;
      transition: transform 0.25s, opacity 0.25s;
    }

    .nav-mobile {
      display: none;
      position: fixed; top: 92px; left: 14px; right: 14px; z-index: 999;
      background: rgba(8,8,8,0.97);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.10); border-radius: 14px;
      padding: 20px; flex-direction: column;
    }
    .nav-mobile.open { display: flex; }
    .nav-mobile a {
      text-decoration: none; color: rgba(255,255,255,0.75);
      font-size: 14px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 13px 8px; border-bottom: 1px solid rgba(255,255,255,0.07);
      transition: color 0.2s;
    }
    .nav-mobile a:last-child { border-bottom: none; }
    .nav-mobile a:hover { color: #fff; }

    @media (max-width: 900px) {
      .nav-links { display: none; }
      .btn-lang { display: none; }
      .nav-hamburger { display: flex; }
    }
    @media (max-width: 480px) {
      .nav { left: 10px; right: 10px; top: 10px; height: 56px; }
      .nav-mobile { left: 10px; right: 10px; top: 80px; }
      .btn-estimate { font-size: 10.5px; padding: 6px 11px; }
    }
  </style>
</head>
<body>

<nav class="nav" id="nav">
  <a class="nav-logo" href="/">
    <img src="/assets/techvenchure-logo.png" alt="Tech Venchure">
  </a>

  <ul class="nav-links">
    <li><a href="#">Work</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">About Us</a></li>
    <li><a href="#">Motion Index</a></li>
    <li><a href="#">Store</a></li>
  </ul>

  <div class="nav-actions">
    <button class="btn-lang" aria-label="Language">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      EN
    </button>
    <a class="btn-estimate" href="#">GET AN ESTIMATE &nbsp;&#8594;</a>
    <button class="nav-hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="nav-mobile" id="mobileMenu">
  <a href="#">Work</a>
  <a href="#">Services</a>
  <a href="#">About Us</a>
  <a href="#">Motion Index</a>
  <a href="#">Store</a>
  <a href="#" style="color:#ff6b00;border-bottom:none;margin-top:8px">Get an Estimate &#8594;</a>
</div>

<script>
  var nav = document.getElementById('nav');
  window.addEventListener('scroll', function() {
    nav.classList.toggle('scrolled', window.scrollY > 20);
  }, { passive: true });

  var hb = document.getElementById('hamburger');
  var mm = document.getElementById('mobileMenu');
  hb.addEventListener('click', function() {
    mm.classList.toggle('open');
    var s = hb.querySelectorAll('span');
    if (mm.classList.contains('open')) {
      s[0].style.transform = 'translateY(6.5px) rotate(45deg)';
      s[1].style.opacity = '0';
      s[2].style.transform = 'translateY(-6.5px) rotate(-45deg)';
    } else {
      s[0].style.transform = s[1].style.opacity = s[2].style.transform = '';
    }
  });
</script>

</body>
</html>
